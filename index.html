<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EZ2 & 3D Swertres Lotto Result Today</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{
  background:linear-gradient(135deg,#0b0b20,#141435,#0b0b20);
  min-height:100vh;
  padding:30px 20px;
}
.container{
  max-width:500px;
  margin:0 auto;
}
h1{
  text-align:center;
  color:#ffd700;
  font-size:28px;
  margin-bottom:30px;
  text-shadow:0 0 10px #ffd70055;
}
.card{
  background:linear-gradient(145deg,#1a1a40,#12122b);
  border:1px solid #ffd70044;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 8px 25px #00000066;
}
.card h2{
  color:#87cefa;
  font-size:20px;
  margin-bottom:15px;
}
.numbers{
  font-size:36px;
  font-weight:800;
  color:#ffd700;
  letter-spacing:6px;
  text-shadow:0 0 12px #ffd70066;
  margin-bottom:10px;
}
.time{
  color:#cccccc;
  font-size:15px;
}
.loading{
  text-align:center;
  color:#fff;
  font-size:20px;
  padding:40px;
}
</style>
</head>
<body>
<div class="container">
<h1>🎰 EZ2 & 3D Swertres Lotto Result Today</h1>
<div id="loading" class="loading">Loading results...</div>
<div id="resultContainer"></div>
</div>

<script>
async function getLottoResults(){
  try{
    const res = await fetch("https://lottoresulta.com/api/v1/latest");
    const data = await res.json();
    const container = document.getElementById("resultContainer");
    const loading = document.getElementById("loading");
    loading.style.display = "none";

    data.forEach(item=>{
      if(item.game==="ez2" || item.game==="3d-lotto"){
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <h2>${item.game.toUpperCase()}</h2>
          <div class="numbers">${item.result}</div>
          <div class="time">Draw Time: ${item.draw_time}</div>
        `;
        container.appendChild(div);
      }
    })
  }catch(err){
    document.getElementById("loading").innerText = "Failed to load results.";
    console.error(err);
  }
}
getLottoResults();
</script>
</body>
</html>
